name: "mutest"
description: "Mutation-testing-driven AI test generation — measure test quality with mutation score, not line coverage"
branding:
  icon: "zap"
  color: "purple"

inputs:
  src:
    description: "Source directory to mutate"
    required: false
    default: "src"
  tests:
    description: "Test directory"
    required: false
    default: "tests"
  model:
    description: "LLM for AI test generation (litellm format, e.g. gpt-4o-mini). Omit to run scoring only."
    required: false
    default: ""
  verify-model:
    description: "Second LLM for cross-model validation of generated tests"
    required: false
    default: ""
  top-n:
    description: "Survived mutants to target with AI tests"
    required: false
    default: "10"
  workers:
    description: "Parallel mutant executions (0 = auto)"
    required: false
    default: "0"
  timeout:
    description: "Per-mutant pytest timeout in seconds"
    required: false
    default: "120"
  fail-under:
    description: "Minimum final mutation score in percentage points (0-100); timeout/error outcomes also fail when set"
    required: false
    default: ""
  incremental:
    description: "Only mutate changed files (set to 'true' for PR runs; use base-ref for committed PR diffs)"
    required: false
    default: "false"
  base-ref:
    description: "Base git revision for incremental PR runs (diffed as base...HEAD)"
    required: false
    default: ""
  report-path:
    description: "Where to write the HTML report"
    required: false
    default: "mutest-report.html"

outputs:
  score:
    description: "Mutation score as JSON (killed/total)"
    value: ${{ steps.run.outputs.score }}
  report:
    description: "Path of the generated HTML report"
    value: ${{ inputs.report-path }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install mutest
      shell: bash
      env:
        MUTEST_ACTION_SHA: ${{ github.action_sha }}
      run: pip install "mutest[ai] @ git+https://github.com/chenyi6758-source/mutest@${MUTEST_ACTION_SHA}"
    - name: Run mutest
      id: run
      shell: bash
      env:
        OPENAI_API_KEY: ${{ env.OPENAI_API_KEY }}
        ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY }}
        MUTEST_SRC: ${{ inputs.src }}
        MUTEST_TESTS: ${{ inputs.tests }}
        MUTEST_MODEL: ${{ inputs.model }}
        MUTEST_VERIFY_MODEL: ${{ inputs.verify-model }}
        MUTEST_TOP_N: ${{ inputs.top-n }}
        MUTEST_WORKERS: ${{ inputs.workers }}
        MUTEST_TIMEOUT: ${{ inputs.timeout }}
        MUTEST_FAIL_UNDER: ${{ inputs.fail-under }}
        MUTEST_INCREMENTAL: ${{ inputs.incremental }}
        MUTEST_BASE_REF: ${{ inputs.base-ref }}
        MUTEST_REPORT_PATH: ${{ inputs.report-path }}
      run: |
        set -euo pipefail
        args=(
          --src "$MUTEST_SRC"
          --tests "$MUTEST_TESTS"
          --top-n "$MUTEST_TOP_N"
          --workers "$MUTEST_WORKERS"
          --timeout "$MUTEST_TIMEOUT"
          --output "$MUTEST_REPORT_PATH"
          --json
        )
        if [[ -n "$MUTEST_FAIL_UNDER" ]]; then args+=(--fail-under "$MUTEST_FAIL_UNDER"); fi
        if [[ -n "$MUTEST_MODEL" ]]; then args+=(--model "$MUTEST_MODEL"); fi
        if [[ -n "$MUTEST_VERIFY_MODEL" ]]; then args+=(--verify-model "$MUTEST_VERIFY_MODEL"); fi
        if [[ "$MUTEST_INCREMENTAL" == "true" ]]; then
          args+=(--incremental)
          if [[ -n "$MUTEST_BASE_REF" ]]; then args+=(--base-ref "$MUTEST_BASE_REF"); fi
        fi
        set +e
        output="$(mutest "${args[@]}")"
        status=$?
        set -e
        score="${output##*$'\n'}"
        printf '%s\n' "$output"
        if [[ "$score" == \{* ]]; then
          printf 'score=%s\n' "$score" >> "$GITHUB_OUTPUT"
        fi
        exit "$status"
    - name: Upload HTML report
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: mutest-report
        path: ${{ inputs.report-path }}
        if-no-files-found: ignore
