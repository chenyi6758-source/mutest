[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mutest"
version = "0.1.0"
description = "Mutation-testing-driven AI test generation loop — the MIT successor to qodo-cover"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Chen Yi", email = "chenyi6758@gmail.com" }]
keywords = ["mutation-testing", "testing", "ai", "pytest", "code-quality"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "jinja2>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ai = ["litellm>=1.0"]
dev = ["pytest>=8.0", "pytest-xdist>=3.0"]

[project.urls]
Homepage = "https://github.com/chenyi6758-source/mutest"
Issues = "https://github.com/chenyi6758-source/mutest/issues"

[project.scripts]
mutest = "mutest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
